<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>약속의 땅</title>
<style>
  :root{
    --ink:#f2ece0; --dim:#b9b1a3; --gold:#fdcc61; --panel:rgba(18,20,24,.86);
    --line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  /* 손가락·바퀴를 이 쪽에서 다 처리한다. 이게 없으면 브라우저가 먼저 채어다가
     이 창을 담고 있는 쪽(구글 사이트)을 굴리거나 넓혀 버린다. */
  html,body{touch-action:none; overscroll-behavior:none}
  canvas,#labels,.lab{touch-action:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d10;color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",
    "Malgun Gothic",system-ui,sans-serif}
  canvas{display:block}

  /* 첫 화면 */
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;background:#0b0d10;z-index:50;text-align:center;padding:24px}
  #boot h1{font:600 22px/1.3 inherit;margin:0;letter-spacing:.02em}
  #bar{width:min(320px,70vw);height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
  #boot p{margin:0;color:var(--dim);font-size:12.5px;max-width:36ch}
  #boot.err h1{color:#ff9d86}
  #boot code{display:block;margin-top:8px;font-size:11px;color:#8d867a;word-break:break-all}

  /* 위쪽 막대 */
  #top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;gap:8px;align-items:flex-start;
    padding:10px;pointer-events:none}
  #top>*{pointer-events:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  #hud{padding:8px 12px;font-size:12px;color:var(--dim);min-width:0}
  #hud b{color:var(--ink);font-weight:600;font-size:13.5px;display:block}
  #search{flex:1;max-width:340px;display:flex;flex-direction:column;overflow:hidden}
  #q{background:none;border:0;outline:0;color:var(--ink);font:inherit;padding:10px 12px;width:100%}
  #q::placeholder{color:#7e786d}
  #hits{max-height:min(46vh,380px);overflow-y:auto;border-top:1px solid var(--line)}
  #hits:empty{display:none}
  .hit{padding:8px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
  .hit:hover{background:rgba(255,255,255,.06)}
  .hit b{font-weight:600}
  .hit s{display:block;color:var(--dim);font-size:11.5px;text-decoration:none;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;
    padding:9px 11px;border-radius:12px}
  .btn:hover{background:rgba(255,255,255,.08)}
  #tools{display:flex;gap:2px;padding:2px}

  /* 이름표 */
  #labels{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}
  .lab{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
    pointer-events:auto;cursor:pointer;font-size:12px;font-weight:500;
    text-shadow:0 1px 3px #000,0 0 8px #000;padding:2px 4px}
  .lab.r0{font-size:16px;font-weight:700;letter-spacing:.01em}
  .lab.r1{font-size:13.5px;font-weight:600}
  .lab.r4,.lab.r5,.lab.r6,.lab.r7,.lab.r8,.lab.r9{color:#cfe0c4;font-style:italic}
  .lab.on{color:var(--gold)}
  .lab i{display:inline-block;width:5px;height:5px;border-radius:3px;background:var(--gold);
    margin-right:5px;vertical-align:2px;box-shadow:0 0 6px rgba(253,204,97,.8)}

  /* 옆 판 */
  #panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);z-index:30;
    background:var(--panel);border-left:1px solid var(--line);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);transform:translateX(102%);transition:transform .22s ease;
    display:flex;flex-direction:column}
  #panel.open{transform:none}
  #ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  #ph h2{margin:0;font-size:17px;font-weight:600;flex:1;min-width:0}
  #ph small{color:var(--dim);font-size:11.5px;font-weight:400}
  #pb{overflow-y:auto;padding:4px 14px 28px}
  .ep{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .ep h3{margin:0 0 5px;font-size:14px;font-weight:600}
  .ep p{margin:0;color:#cfc8ba;font-size:13px}
  .ep .ref{display:inline-block;margin-top:6px;font-size:11.5px;color:var(--gold);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .ep .era{float:right;font-size:10.5px;color:#8d867a;border:1px solid var(--line);
    border-radius:8px;padding:1px 6px}
  .note{color:#cfc8ba;font-size:13px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  .note em{display:block;color:var(--gold);font-style:normal;font-size:11.5px;margin-bottom:4px}

  /* 암호 — 자물쇠가 아니라 커튼이다 */
  #gate{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;background:#0b0d10;padding:24px}
  #gate h1{font:600 22px/1.3 inherit;margin:0;letter-spacing:.02em}
  #gate p{margin:0;color:var(--dim);font-size:12.5px}
  #gateForm{display:flex;gap:8px;align-items:center}
  #pw{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font:16px/1 inherit;padding:11px 14px;width:150px;text-align:center;
    letter-spacing:.35em;outline:0}
  #pw:focus{border-color:var(--gold)}
  #go{border:0;background:var(--gold);color:#1a1408;font:600 14px/1 inherit;
    padding:12px 18px;border-radius:10px;cursor:pointer}
  #gateNo{color:#ff9d86;font-size:12.5px;min-height:1em;margin:0}
  /* 지형 그림이 수십 MB 다. 셀룰러로 열면 데이터가 훅 나간다 — 미리 일러 준다 */
  #gateTip{display:flex;align-items:center;gap:7px;margin:2px 0 0;padding:9px 13px;
    border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.035);
    color:#8d867a;font-size:12px;line-height:1.5;max-width:300px;text-align:left}
  #gateTip svg{width:15px;height:15px;flex:0 0 auto;color:var(--gold);opacity:.9}
  #gateTip b{color:var(--ink);font-weight:600}

  @media (max-width:560px){
    #hud{display:none}
    .lab{font-size:11px}
    .lab.r0{font-size:14px}
  }
</style>
</head>
<body>

<div id="gate">
  <h1>약속의 땅</h1>
  <p>암호를 넣으십시오</p>
  <form id="gateForm" autocomplete="off">
    <input id="pw" type="password" inputmode="numeric" autocomplete="off"
           aria-label="암호" maxlength="24">
    <button id="go" type="submit">들어가기</button>
  </form>
  <p id="gateNo"></p>
  <p id="gateTip">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 3.1c2.6 0 4.9 1 6.6 2.7l-1.3 1.4A7.8 7.8 0 0 0 8 5.1a7.8 7.8 0 0 0-5.3 2.1L1.4 5.8A9.5 9.5 0 0 1 8 3.1z"/>
      <path d="M8 7c1.4 0 2.7.6 3.7 1.5l-1.3 1.4A3.9 3.9 0 0 0 8 9c-.9 0-1.8.3-2.4.9L4.3 8.5A5.6 5.6 0 0 1 8 7z"/>
      <circle cx="8" cy="12.3" r="1.4"/>
    </svg>
    <span>지형 자료가 큽니다. 되도록 <b>와이파이</b>에서 여시기를 권합니다</span>
  </p>
</div>

<div id="boot">
  <h1>약속의 땅</h1>
  <div id="bar"><i></i></div>
  <p id="bootmsg">자료를 불러오는 중…</p>
  <code id="booterr"></code>
</div>

<div id="labels"></div>

<div id="top">
  <div id="hud" class="card"><b id="hudPlace">—</b><span id="hudSub"></span></div>
  <div id="search" class="card">
    <input id="q" autocomplete="off" spellcheck="false" placeholder="지명·인물·낱말 찾기">
    <div id="hits"></div>
  </div>
  <div id="tools" class="card">
    <button class="btn" id="langBtn" title="한국어 / English">EN</button>
    <button class="btn" id="homeBtn" title="처음 자리로">⌂</button>
  </div>
</div>

<div id="panel">
  <div id="ph">
    <h2 id="pTitle">—</h2>
    <small id="pSub"></small>
    <button class="btn" id="closeBtn">✕</button>
  </div>
  <div id="pb"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // 세 군데를 차례로 두들긴다 — 한 곳이 막혀도 뜨게.
  if (!window.THREE) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');
  }
</script>
<script>
  if (!window.THREE) {
    document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');
  }
</script>
<script>
  // 암호 — 맞으면 그때 지도를 불러온다.
  //
  // 이건 자물쇠가 아니라 **커튼**이다. 소스를 열면 이 검사 코드가 보이고,
  // 자료 파일은 주소만 알면 그냥 받아진다. 모르는 사람이 우연히 들어오는
  // 것을 막는 정도로만 쓸 것. 암호 자체는 적어 두지 않고 뒤섞은 값만 둔다.
  (function () {
    var KEY  = '1y8ryty';                 // 들어오는 암호
    var AKEY = '18j4v88';                 // 관리용 암호 — 보이는 지도는 똑같고
                                          // 「관리」 단추가 하나 더 붙는다
    // 셈은 이 쪽에서 할 수 없다. 깃허브 페이지는 파일을 내주기만 할 뿐
    // 아무것도 기억하지 못하는 곳이라, 바깥의 조그만 셈 지기를 빌린다.
    var NS = 'theland-wrc-2f91';
    var CNT = 'https://abacus.jasoncameron.dev/';

    var gate = document.getElementById('gate');
    var pw   = document.getElementById('pw');
    var no   = document.getElementById('gateNo');

    function scramble(s) {
      var h = 5381, t = 'TheLand::' + s;
      for (var i = 0; i < t.length; i++) h = ((h * 33) ^ t.codePointAt(i)) >>> 0;
      return h.toString(36);
    }
    function bump(k) {
      try { fetch(CNT + 'hit/' + NS + '/' + k, { cache: 'no-store' }).catch(function () {}); }
      catch (e) {}
    }
    // 지금 몇 사람이 열어 두고 있는가.
    //
    // 셈 지기는 「하나 늘려 주시오」밖에 못 한다 — 누가 나갔는지는 모른다.
    // 그래서 **분 단위 칸**을 쓴다. 열려 있는 창은 한 분에 딱 한 번 그 분의
    // 칸을 하나 늘린다. 그러면 지난 한 분의 칸에 적힌 수가 곧 그동안
    // 열려 있던 창의 수다. 창을 닫으면 다음 분부터 저절로 빠진다.
    //
    // 칸은 두 갈래다. 「m-」은 보통 손님, 「a-」는 관리용 암호로 들어온 창.
    // 예전에는 관리자가 아예 세지 않아서, 화면에 뜬 수가 나인지 남인지
    // 알 수가 없었다. 이제 갈라 세고, 관리 판에서 갈라 보여 준다.
    function minuteKey(d, pre) {
      return (pre || 'm-') + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2)
                  + ('0' + d.getDate()).slice(-2) + ('0' + d.getHours()).slice(-2)
                  + ('0' + d.getMinutes()).slice(-2);
    }
    function heartbeat(pre) {
      var last = null;
      function beat() {
        var k = minuteKey(new Date(), pre);
        if (k === last) return;            // 한 분에 한 번만
        last = k;
        bump(k);
      }
      beat();
      setInterval(beat, 15000);
    }
    function open(admin, fresh) {
      window.__ADMIN = !!admin;
      window.__NS = NS;
      window.__CNT = CNT;
      window.__MKEY = minuteKey;
      gate.remove();
      heartbeat(admin ? 'a-' : 'm-');
      var s = document.createElement('script');
      // 깃허브는 파일을 십 분쯤 물고 있는다. 새로 올려도 옛 것이 돌아
      // 「고쳤는데 그대로네」 하기 십상이라, app.js 만은 늘 새로 받는다.
      s.src = 'app.js?v=' + Math.floor(Date.now() / 60000);
      document.body.appendChild(s);
    }
    try {
      var was = sessionStorage.getItem('theland.ok');
      if (was === KEY)  return open(false, false);
      if (was === AKEY) return open(true, false);
    } catch (e) {}

    document.getElementById('gateForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var h = scramble(pw.value.trim());
      if (h !== KEY && h !== AKEY) {
        no.textContent = '암호가 다릅니다';
        pw.value = ''; pw.focus();
        return;
      }
      try { sessionStorage.setItem('theland.ok', h); } catch (e) {}
      open(h === AKEY, true);
    });
    pw.focus();
  })();
</script>
</body>
</html>
